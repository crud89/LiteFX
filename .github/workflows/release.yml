name: Publish Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major Version'
        required: true
      minor:
        description: 'Minor Version'
        required: true
      build:
        description: 'Build Number'
        required: true
      releaseLog:
        description: 'Location of the Release Log file.'
        required: true
      signing:
        description: 'Code signing method for the release binaries.'
        type: choice
        options: [ 'none', 'certificate' ]
        default: 'none'

permissions:
  contents: read

jobs:
  # ------------------------------------- Version             -------------------------------------
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      year: ${{ steps.year.outputs.year }}

    steps:
      - name: Determine year
        id: year
        shell: bash
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

  # ------------------------------------- Build               -------------------------------------
  # Release builds only read from the vcpkg binary cache, which is written by trusted weekly runs.
  build:
    needs: version
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: release
      version: ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.build }}.${{ needs.version.outputs.year }}
      install: true
      signing: ${{ inputs.signing }}
    secrets:
      SIGN_CERTIFICATE_BASE64: ${{ secrets.SIGN_CERTIFICATE_BASE64 }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.SIGN_CERTIFICATE_PASSWORD }}

  # ------------------------------------- Publish             -------------------------------------
  publish:
    name: publish
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.build }}
      PACKAGE_DIR: ${{ github.workspace }}/../packages

    steps:
      - name: Download install artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: LiteFX-*-install
          path: ${{ github.workspace }}/../artifacts

      # Each artifact `LiteFX-<package>-install` becomes `<package>.zip`, so new platforms are picked up automatically.
      - name: Create packages
        shell: bash
        run: |
          mkdir -p "$PACKAGE_DIR"
          for dir in "${GITHUB_WORKSPACE}"/../artifacts/LiteFX-*-install; do
            package=$(basename "$dir")
            package=${package#LiteFX-}
            package=${package%-install}
            (cd "$dir" && zip -qr "$PACKAGE_DIR/${package}.zip" .)
          done
          ls -l "$PACKAGE_DIR"

      # Verify: gh attestation verify <package>.zip -R crud89/LiteFX
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.PACKAGE_DIR }}/*.zip

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_BOT_PAT }}

      - name: Update version
        shell: pwsh
        run: ./write-version.ps1 -major ${{ inputs.major }} -minor ${{ inputs.minor }} -build ${{ inputs.build }} -year ${{ needs.version.outputs.year }}

      - name: Build documentation
        uses: mattnotmitt/doxygen-action@v1
        with:
          working-directory: .
          doxyfile-path: ./.doxyfile

      - name: Commit and tag release
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: Release Bot 🤖
          commit_user_email: 18394207+github-actions[bot]@users.noreply.github.com
          commit_message: Release ${{ env.VERSION }} 🚀
          status_options: --untracked-files=all
          add_options: --ignore-removal
          skip_dirty_check: true
          disable_globbing: true
          tagging_message: v${{ env.VERSION }}

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.PACKAGE_DIR }}/*.zip
          token: ${{ secrets.RELEASE_BOT_PAT }}
          bodyFile: ${{ github.workspace }}/${{ inputs.releaseLog }}
          name: v${{ env.VERSION }}
          tag: v${{ env.VERSION }}
