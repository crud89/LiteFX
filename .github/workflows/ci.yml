name: Pull Request Checks

# Triggered manually or by commenting on a pull request with `Run: <commands>`, where commands contains one or more of:
#
# - `tests`: runs tests
# - `tidy`: runs static code analysis
# - `builds`: builds all targets
# - `checks`: runs everything of the above
#
# Commands can only be issued by the repository owner, members, collaborators or previous contributors.
on:
  issue_comment:
    types: [ created, edited ]

  workflow_dispatch:
    inputs:
      pullRequest:
        description: 'Pull Request ID'
        required: true
      command:
        description: 'Command (one or more of: checks, tests, tidy, builds)'
        required: true
        default: 'checks'

permissions:
  contents: read

jobs:
  # ------------------------------------- Verification        -------------------------------------
  verify:
    name: verify-permissions
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, 'Run:')) }}
    permissions:
      pull-requests: write
      issues: write
    outputs:
      commands: ${{ steps.parse.outputs.commands }}
      sha: ${{ steps.pr.outputs.sha }}

    steps:
      - name: Check permission
        if: ${{ github.event_name == 'issue_comment' }}
        shell: bash
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) ;;
            *) echo "::error::Insufficient permission ($ASSOCIATION). Only existing contributors may trigger CI runs."; exit 1 ;;
          esac

      - name: Parse command
        id: parse
        shell: bash
        env:
          COMMAND: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.command }}
        run: |
          commands=()
          [[ "$COMMAND" == *checks* || "$COMMAND" == *tests*  ]] && commands+=(test)
          [[ "$COMMAND" == *checks* || "$COMMAND" == *tidy*   ]] && commands+=(tidy)
          [[ "$COMMAND" == *checks* || "$COMMAND" == *builds* ]] && commands+=(build)
          echo "commands=$(IFS=,; echo "${commands[*]}")" >> "$GITHUB_OUTPUT"

      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pullRequest }}
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER)
            });
            core.info(`HEAD SHA = ${data.head.sha}, REF = ${data.head.ref}`);
            core.setOutput('sha', data.head.sha);

      - name: Confirm run
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

  # ------------------------------------- Checks              -------------------------------------
  # Pull request runs never write to the vcpkg binary cache, to prevent untrusted code from poisoning it.
  tests:
    needs: verify
    if: ${{ contains(needs.verify.outputs.commands, 'test') }}
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: test
      ref: ${{ needs.verify.outputs.sha }}
      check-sha: ${{ needs.verify.outputs.sha }}

  tidy:
    needs: verify
    if: ${{ contains(needs.verify.outputs.commands, 'tidy') }}
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: tidy
      ref: ${{ needs.verify.outputs.sha }}
      check-sha: ${{ needs.verify.outputs.sha }}

  builds:
    needs: verify
    if: ${{ contains(needs.verify.outputs.commands, 'build') }}
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: build
      ref: ${{ needs.verify.outputs.sha }}
      check-sha: ${{ needs.verify.outputs.sha }}
      upload-build: true
