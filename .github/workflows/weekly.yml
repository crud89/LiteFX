name: Weekly

on:
  workflow_dispatch:
    inputs:
      uploadBuildArtifacts:
        description: 'Upload build artifacts'
        type: boolean
        default: false

  schedule:
    - cron: '1 0 * * 1'         # Every monday at 00:01 AM (UTC).

permissions:
  contents: read

jobs:
  # Weekly runs build the default branch, so they are trusted to update the vcpkg binary cache.
  weekly:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: build
      cache-write: true
      install: true
      upload-build: ${{ inputs.uploadBuildArtifacts == true }}

  # Also run the tests, which refreshes the cache for the test triplets.
  tests:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      purpose: test
      cache-write: true
