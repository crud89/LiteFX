site_name: LiteFX
site_url: https://litefx.crudolph.io/
site_description: A modern, flexible computer graphics and rendering engine, written in C++23 with support for Vulkan and DirectX 12.
site_author: Carsten Rudolph
copyright: Copyright &copy; Carsten Rudolph

repo_url: https://github.com/crud89/LiteFX
repo_name: crud89/LiteFX
edit_uri: edit/main/docs/site/content/

docs_dir: content

# Report broken links to headings (anchors) as warnings, so that `mkdocs build --strict` fails on them.
validation:
  anchors: warn

# The API pages are added to the navigation by hooks/api_reference.py, so they are intentionally missing from `nav`.
not_in_nav: |
  /api/**

exclude_docs: |
  api/reference.tag.xml

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/crud89/LiteFX
      name: Source code on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:me@crudolph.io
      name: Reach out to the author
    - icon: fontawesome/solid/globe
      link: https://www.crudolph.io
      name: Visit the author's website

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

hooks:
  - hooks/api_reference.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Project Setup: getting-started/project-setup.md
  - Tutorials:
      - tutorials/index.md
      - Your First Triangle:
          - tutorials/first-triangle/index.md
          - 1. The Application: tutorials/first-triangle/application.md
          - 2. The Device: tutorials/first-triangle/device.md
          - 3. Render Pass and Frame Buffers: tutorials/first-triangle/render-pass.md
          - 4. Shaders: tutorials/first-triangle/shaders.md
          - 5. The Render Pipeline: tutorials/first-triangle/pipeline.md
          - 6. Drawing: tutorials/first-triangle/drawing.md
  # NOTE: The API reference must be generated first using the respective CMake target.
  - API Reference: api/index.md
  - Wiki: https://github.com/crud89/LiteFX/wiki
